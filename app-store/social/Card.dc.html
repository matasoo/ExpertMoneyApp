<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2ECC71; }
    a:hover { color: #7ef0ae; }
  </style>
</helmet>

<div style="position: relative; width: 1600px; height: 900px; overflow: hidden; background: #141416; font-family: Manrope, 'Segoe UI', system-ui, sans-serif;">

  <div style="position: absolute; top: -420px; right: -180px; width: 1100px; height: 1100px; border-radius: 50%; background: radial-gradient(circle, rgba(46,204,113,0.24), rgba(46,204,113,0) 68%); filter: blur(110px);"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 78px 80px; width: 830px;">

    <div style="display: flex; align-items: center; gap: 16px;">
      <img src="logo.jpg" alt="" style="width: 50px; height: 50px; border-radius: 13px; display: block;">
      <span style="font-size: 33px; font-weight: 600; letter-spacing: -0.02em; color: #ffffff;">Expert<span style="font-weight: 800; color: #2ECC71;">Money</span></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 26px;">
      <h1 style="margin: 0; font-size: 82px; font-weight: 800; line-height: 1.0; letter-spacing: -0.045em; color: #ffffff;">Know what&#39;s safe<br>to spend <span style="color: #2ECC71;">today</span>.</h1>

      <div style="display: flex; flex-direction: column; gap: 15px;">
        <div style="display: flex; align-items: center; gap: 16px;">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#2ECC71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span style="font-size: 28px; font-weight: 600; color: #d2d2d4;">Budgets that warn you before you overspend</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#2ECC71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span style="font-size: 28px; font-weight: 600; color: #d2d2d4;">Savings goals with a weekly pace</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#2ECC71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span style="font-size: 28px; font-weight: 600; color: #d2d2d4;">Every account in one balance. No bank login.</span>
        </div>
      </div>
    </div>

    <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 13px; padding: 16px 28px; border-radius: 100px; background: rgba(46,204,113,0.10); border: 2px solid rgba(46,204,113,0.30);">
      <svg viewBox="0 0 24 24" width="27" height="27" fill="#2ECC71" aria-hidden="true"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 2.9-.7s1.7.7 2.9.7 2-1.1 2.7-2.2c.9-1.2 1.2-2.4 1.3-2.5-.1 0-2.4-.9-2.4-3.6zM14.2 5.9c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.8 1 0 2-.5 2.6-1.3z"/></svg>
      <span style="font-size: 25px; font-weight: 700; letter-spacing: -0.01em; color: #8ce8b3;">{{badge}}</span>
    </div>

  </div>

  <div style="position: absolute; right: 316px; top: 148px; width: 322px; border-radius: 38px; overflow: hidden; border: 3px solid rgba(255,255,255,0.10); box-shadow: 0 40px 90px rgba(0,0,0,0.6); transform: rotate(-6deg);">
    <img src="wallet.jpg" alt="ExpertMoney wallet" style="display: block; width: 100%;">
  </div>

  <div style="position: absolute; right: 74px; top: 96px; width: 352px; border-radius: 42px; overflow: hidden; border: 3px solid rgba(255,255,255,0.16); box-shadow: 0 50px 110px rgba(0,0,0,0.7);">
    <img src="dashboard.jpg" alt="ExpertMoney dashboard" style="display: block; width: 100%;">
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"status":{"editor":"enum","options":["soon","live"],"default":"soon","section":"Launch"},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const status = this.props.status ?? 'soon';
    return {
      badge: status === 'live' ? 'Now on the App Store' : 'Coming soon to the App Store'
    };
  }
}
</script>
</body>
</html>
