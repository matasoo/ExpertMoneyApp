<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2ECC71; }
    a:hover { color: #7ef0ae; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #141416; font-family: Manrope, 'Segoe UI', system-ui, sans-serif;">

  <div style="position: absolute; top: -340px; right: -240px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(46,204,113,0.30), rgba(46,204,113,0) 68%); filter: blur(90px);"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 76px 72px;">

    <div style="display: flex; align-items: center; gap: 18px;">
      <img src="logo.jpg" alt="" style="width: 60px; height: 60px; border-radius: 15px; display: block;">
      <span style="font-size: 40px; font-weight: 600; letter-spacing: -0.02em; color: #ffffff;">Expert<span style="font-weight: 800; color: #2ECC71;">Money</span></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 30px; max-width: 560px;">
      <h1 style="margin: 0; font-size: 132px; font-weight: 800; line-height: 0.94; letter-spacing: -0.05em; color: #ffffff;">Plan.<br>Save.<br><span style="color: #2ECC71;">Grow.</span></h1>
      <p style="margin: 0; font-size: 33px; font-weight: 500; line-height: 1.42; color: #A0A0A0; text-wrap: pretty;">The financial planner that turns your income into goals you actually reach.</p>
    </div>

    <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 14px; padding: 18px 30px; border-radius: 100px; background: rgba(46,204,113,0.10); border: 2px solid rgba(46,204,113,0.30);">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="#2ECC71" aria-hidden="true"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 2.9-.7s1.7.7 2.9.7 2-1.1 2.7-2.2c.9-1.2 1.2-2.4 1.3-2.5-.1 0-2.4-.9-2.4-3.6zM14.2 5.9c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.8 1 0 2-.5 2.6-1.3z"/></svg>
      <span style="font-size: 27px; font-weight: 700; letter-spacing: -0.01em; color: #8ce8b3;">{{badge}}</span>
    </div>

  </div>

  <div style="position: absolute; right: -54px; bottom: -132px; width: 452px; border-radius: 46px; overflow: hidden; border: 3px solid rgba(255,255,255,0.14); box-shadow: 0 50px 110px rgba(0,0,0,0.66); transform: rotate(-5deg);">
    <img src="dashboard.jpg" alt="ExpertMoney dashboard" style="display: block; width: 100%;">
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"status":{"editor":"enum","options":["soon","live"],"default":"soon","section":"Launch"},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const status = this.props.status ?? 'soon';
    return {
      badge: status === 'live' ? 'Now on the App Store' : 'Coming soon to the App Store'
    };
  }
}
</script>
</body>
</html>
