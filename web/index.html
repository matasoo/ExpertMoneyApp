<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="expert_money_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>expert_money_flutter</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    :root {
      --bg-color: #F4F6F8;
      --text-color: #1E1E1E;
      --primary: #2ECC71;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #202022;
        --text-color: #FFFFFF;
      }
    }

    body {
      background-color: var(--bg-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: gentle-fade-in 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .brand-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
    }

    .expert {
      color: var(--text-color);
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 2px;
    }

    .money {
      color: var(--primary);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .progress-bar-container {
      margin-top: 24px;
      width: 120px;
      height: 2px;
      background-color: rgba(16, 185, 129, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 30%;
      background-color: var(--primary);
      border-radius: 2px;
      animation: progress-shimmer 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes gentle-fade-in {
      0% {
        opacity: 0;
        transform: translateY(10px);
        letter-spacing: 0px;
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        letter-spacing: 2px;
      }
    }

    @keyframes progress-shimmer {
      0% {
        left: -30%;
        opacity: 0.8;
      }
      50% {
        opacity: 1;
      }
      100% {
        left: 100%;
        opacity: 0.8;
      }
    }

    /* Hide the default Flutter web loader */
    .flutter-loader {
      display: none !important;
    }
  </style>

  <div id="loading_indicator">
    <div class="splash-container">
      <div class="brand-container">
        <span class="expert">Expert</span><span class="money">Money</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Remove the custom loading indicator once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading_indicator');
      if (loader) {
        loader.style.display = 'none';
      }
    });
  </script>
</body>
</html>
