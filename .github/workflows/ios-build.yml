name: iOS Build
run-name: iOS Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to build (empty builds this branch)'
        required: false
        type: string
        default: ''
      ios_path:
        description: 'Path to iOS project (e.g., "ios" for React Native)'
        required: false
        type: string
        default: '.'
      scheme:
        description: 'Xcode scheme to build (auto-detected if empty)'
        required: false
        type: string
        default: ''
      use_signing:
        description: 'Enable code signing (requires secrets to be configured)'
        required: false
        type: boolean
        default: false
      configuration:
        description: 'Build configuration (use Release for sideloading — Debug builds need a debugger attached and crash at launch on device)'
        required: false
        type: string
        default: 'Release'
      flutter_version:
        description: 'Flutter version to use (e.g., 3.24.0). Empty means latest stable.'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create real .env file
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE_CONTENT }}
          EOF

      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot
          echo "Building $(git rev-parse --short HEAD)"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        id: cache-deriveddata
        with:
          path: DerivedData
          key: deriveddata-${{ github.run_id }}
          restore-keys: |
            deriveddata-

      - name: Detect project type
        id: detect
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "type=flutter" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ] && grep -q '"expo"' package.json; then
            echo "type=expo" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ] && grep -q '"react-native"' package.json; then
            echo "type=reactnative" >> $GITHUB_OUTPUT
          else
            echo "type=native" >> $GITHUB_OUTPUT
          fi

      - name: Generate Xcode project (XcodeGen)
        env:
          IOS_PATH: ${{ inputs.ios_path }}
        run: |
          set -e
          cd "$IOS_PATH"

          MANIFEST=""
          for f in project.yml project.yaml; do
            if [ -f "$f" ] && grep -qE '^targets:' "$f"; then
              MANIFEST="$f"
              break
            fi
          done

          if [ -z "$MANIFEST" ]; then
            echo "No XcodeGen manifest — skipping."
          elif [ -n "$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)" ]; then
            echo "Found a committed .xcodeproj — skipping generation."
          else
            echo "Found $MANIFEST and no .xcodeproj — generating with XcodeGen."
            brew install xcodegen
            xcodegen generate
          fi

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '' }}
          channel: ${{ inputs.flutter_version && 'stable' || 'stable' }}
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.type == 'flutter'
        run: flutter pub get

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install npm dependencies
        if: (steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo') && steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Restore Pods cache
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: |
            ${{ inputs.ios_path }}/Pods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles(format('{0}/Podfile.lock', inputs.ios_path)) }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install certificate and provisioning profile
        if: inputs.use_signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -e

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PLIST=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(plutil -extract UUID raw -o - "$PROFILE_PLIST")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST")
          PROFILE_NAME=$(plutil -extract Name raw -o - "$PROFILE_PLIST")
          APP_ID=$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID=${APP_ID#"$TEAM_ID".}

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "Certificate and provisioning profile installed"

      - name: Build IPA
        env:
          BUILD_ID: ${{ inputs.build_id }}
          IOS_PATH: ${{ inputs.ios_path }}
          SCHEME: ${{ inputs.scheme }}
          PROJECT_TYPE: ${{ steps.detect.outputs.type }}
          USE_SIGNING: ${{ inputs.use_signing }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -e
          cd "$IOS_PATH"
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)

          if [ -f "Podfile" ]; then
            echo "Running pod install..."
            pod install
            WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          fi

          if [ -z "$SCHEME" ] && [ "$PROJECT_TYPE" = "native" ]; then
            if [ -n "$WORKSPACE" ]; then
              SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | grep -A 100 "Schemes:" | tail -n +2 | grep -v -E "^[[:space:]]*Pods-" | head -1 | xargs)
              if [ -z "$SCHEME" ]; then
                SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | grep -A 100 "Schemes:" | tail -n +2 | head -1 | xargs)
              fi
            elif [ -n "$PROJECT" ]; then
              SCHEME=$(xcodebuild -project "$PROJECT" -list 2>/dev/null | grep -A 100 "Schemes:" | tail -n +2 | head -1 | xargs)
            fi
          fi

          DERIVED_DATA_PATH="${GITHUB_WORKSPACE}/DerivedData"

          if [ "$PROJECT_TYPE" = "flutter" ]; then
            cd "$GITHUB_WORKSPACE"
            
            if [ "$CONFIGURATION" = "Debug" ]; then
              FLUTTER_CONF="debug"
            else
              FLUTTER_CONF="release"
            fi

            if [ "$USE_SIGNING" = "true" ]; then
              flutter build ios --$FLUTTER_CONF
              cd "$GITHUB_WORKSPACE/ios"
              if [ -d "Runner.xcworkspace" ]; then TARGET_ARGS="-workspace 'Runner.xcworkspace'"; else TARGET_ARGS="-project 'Runner.xcodeproj'"; fi
              ARCHIVE_CMD="xcodebuild $TARGET_ARGS -scheme '${SCHEME:-Runner}' -configuration '$CONFIGURATION' -destination 'generic/platform=iOS' -derivedDataPath '$DERIVED_DATA_PATH' IPHONEOS_DEPLOYMENT_TARGET=15.0 COMPILER_INDEX_STORE_ENABLE=NO DEVELOPMENT_TEAM='$DEVELOPMENT_TEAM' CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER='$PROVISIONING_PROFILE_NAME' -quiet -archivePath '$GITHUB_WORKSPACE/build/App.xcarchive' archive"
              eval $ARCHIVE_CMD
            else
              echo "=== Forcing Flutter to setup project WITHOUT compiling ==="
              flutter build ios --$FLUTTER_CONF --config-only || true
              
              echo "=== Switching to ios folder ==="
              cd "$GITHUB_WORKSPACE/ios"
              
              echo "=== Removing signing from Xcode project ==="
              sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' Runner.xcodeproj/project.pbxproj 2>/dev/null || true
              
              echo "=== Native Xcode Build (Strictly Unsigned & Forced iOS 15.0) ==="
              if [ -d "Runner.xcworkspace" ]; then TARGET_ARGS="-workspace 'Runner.xcworkspace'"; else TARGET_ARGS="-project 'Runner.xcodeproj'"; fi
              BUILD_CMD="xcodebuild build $TARGET_ARGS -scheme '${SCHEME:-Runner}' -configuration '$CONFIGURATION' -destination 'generic/platform=iOS' -derivedDataPath '$DERIVED_DATA_PATH' IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' EXPANDED_CODE_SIGN_IDENTITY='' COMPILER_INDEX_STORE_ENABLE=NO ENABLE_DEBUG_DYLIB=NO -quiet"
              eval $BUILD_CMD
            fi

          elif [ "$PROJECT_TYPE" = "reactnative" ] || [ "$PROJECT_TYPE" = "expo" ]; then
            BUILD_CMD="xcodebuild"
            if [ -n "$WORKSPACE" ]; then
              BUILD_CMD="$BUILD_CMD -workspace $WORKSPACE"
            elif [ -n "$PROJECT" ]; then
              BUILD_CMD="$BUILD_CMD -project $PROJECT"
            fi
            if [ -n "$WORKSPACE" ]; then
              SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            elif [ -n "$PROJECT" ]; then
              SCHEME=$(basename "$PROJECT" .xcodeproj)
            fi
            BUILD_CMD="$BUILD_CMD -scheme '$SCHEME' -configuration '$CONFIGURATION' -destination 'generic/platform=iOS' -derivedDataPath '$DERIVED_DATA_PATH' IPHONEOS_DEPLOYMENT_TARGET=15.0 COMPILER_INDEX_STORE_ENABLE=NO -quiet"
            if [ "$USE_SIGNING" = "true" ]; then
              BUILD_CMD="$BUILD_CMD DEVELOPMENT_TEAM='$DEVELOPMENT_TEAM' CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER='$PROVISIONING_PROFILE_NAME' -archivePath '$GITHUB_WORKSPACE/build/App.xcarchive' archive"
            else
              BUILD_CMD="$BUILD_CMD CODE_SIGNING_ALLOWED=NO build"
            fi
            eval $BUILD_CMD
          else
            BUILD_CMD="xcodebuild"
            if [ -n "$WORKSPACE" ]; then
              BUILD_CMD="$BUILD_CMD -workspace $WORKSPACE"
            elif [ -n "$PROJECT" ]; then
              BUILD_CMD="$BUILD_CMD -project $PROJECT"
            fi
            BUILD_CMD="$BUILD_CMD -scheme '$SCHEME' -configuration '$CONFIGURATION' -destination 'generic/platform=iOS' -derivedDataPath '$DERIVED_DATA_PATH' IPHONEOS_DEPLOYMENT_TARGET=15.0 COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf ONLY_ACTIVE_ARCH=YES -quiet SWIFT_ENABLE_COMPILE_CACHE=YES CLANG_ENABLE_COMPILE_CACHE=YES"
            if [ "$USE_SIGNING" = "true" ]; then
              BUILD_CMD="$BUILD_CMD DEVELOPMENT_TEAM='$DEVELOPMENT_TEAM' CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER='$PROVISIONING_PROFILE_NAME' -archivePath '$GITHUB_WORKSPACE/build/App.xcarchive' archive"
            else
              BUILD_CMD="$BUILD_CMD CODE_SIGNING_ALLOWED=NO build"
            fi
            eval $BUILD_CMD
          fi

          # Create IPA
          if [ "$USE_SIGNING" = "true" ]; then
            cd "$GITHUB_WORKSPACE"
            APP_BUNDLE_ID=$(plutil -extract ApplicationProperties.CFBundleIdentifier raw -o - build/App.xcarchive/Info.plist)
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '    <key>method</key>' \
              '    <string>development</string>' \
              '    <key>signingStyle</key>' \
              '    <string>manual</string>' \
              '    <key>teamID</key>' \
              "    <string>${DEVELOPMENT_TEAM}</string>" \
              '    <key>provisioningProfiles</key>' \
              '    <dict>' \
              "        <key>${APP_BUNDLE_ID}</key>" \
              "        <string>${PROVISIONING_PROFILE_NAME}</string>" \
              '    </dict>' \
              '</dict>' \
              '</plist>' > ExportOptions.plist
            xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export
            mv build/export/*.ipa "build/$BUILD_ID.ipa"
          else
            # Find .app anywhere it might have compiled
            APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products/${CONFIGURATION}-iphoneos" -name "*.app" -type d | head -1 2>/dev/null || true)
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find "${GITHUB_WORKSPACE}/build/ios/iphoneos" -name "*.app" -type d | head -1 2>/dev/null || true)
            fi

            if [ -z "$APP_PATH" ]; then
              echo "Error: Could not find .app"
              exit 1
            fi
            cd "$GITHUB_WORKSPACE"
            mkdir -p build/Payload
            cp -R "$APP_PATH" build/Payload/
            cd build
            zip -rq "$BUILD_ID.ipa" Payload
            rm -rf Payload
            echo "Created unsigned IPA: build/$BUILD_ID.ipa"
          fi

      - name: Verify IPA is runnable on device
        if: steps.detect.outputs.type == 'flutter'
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/ipa-verify && mkdir -p /tmp/ipa-verify
          unzip -q "build/$BUILD_ID.ipa" -d /tmp/ipa-verify
          if find /tmp/ipa-verify/Payload -name kernel_blob.bin | grep -q .; then
            echo "::error::This is a JIT (Debug) Flutter build. It will show a white screen and crash on launch when installed on a device. Re-run with configuration=Release."
            exit 1
          fi
          echo "AOT build confirmed — no kernel_blob.bin."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Save DerivedData cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: DerivedData
          key: deriveddata-${{ github.run_id }}

      - name: Cleanup signing
        if: always() && inputs.use_signing
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Build summary
        if: always()
        env:
          USE_SIGNING: ${{ inputs.use_signing }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID:** ${{ inputs.build_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ "$USE_SIGNING" = "true" ]; then
            echo "- **Signing:** Signed (development)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Signing:** Unsigned (sign locally with AltStore/Sideloadly)" >> $GITHUB_STEP_SUMMARY
          fi